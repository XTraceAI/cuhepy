[project]
name = "cuhepy"
dynamic = ["version"]
description = "GPU-accelerated homomorphic encryption in Python: Paillier and BFV, with encrypted nearest-neighbour search"
authors = [{ name = "XTrace Inc." }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gmpy2>=2.2.1",
    "msgpack>=1.0",
    "numpy>=2.3.1",
    "pycryptodome>=3.23.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/XTraceAI/cuhepy"
Documentation = "https://github.com/XTraceAI/cuhepy#readme"
Repository = "https://github.com/XTraceAI/cuhepy"
Issues = "https://github.com/XTraceAI/cuhepy/issues"


[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build]
# Force-include optional native extension binaries even though *.so is ignored.
# GPU binaries use build_gpu_binaries.sh; BFV CPU kernels use their local Makefile.
artifacts = [
    "src/cuhepy/paillier/_gpu_ext/*.so",
    "src/cuhepy/paillier/_lookup_gpu_ext/*.so",
    "src/cuhepy/bfv/_cpu_ext/*.so",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cuhepy"]

# Custom hook flips the wheel from pure-Python (py3-none-any) to a
# platform-specific tag when compiled extensions are bundled.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/cuhepy", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]
exclude = ["tests", "docs", "benchmarks"]

[project.optional-dependencies]
bfv-nitro = [
    "cbor2==6.1.4",
    "pyOpenSSL==26.4.0",
    "cryptography==50.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.11",
    "types-setuptools>=80.9.0.20250822",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist", "docs"]
force-exclude = true

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]
ignore = [
  "E501",   # line too long
  "I001",   # imports not sorted/formatted
  "B027",   # empty methods in ABCs without @abstractmethod
  "B010",   # setattr with constant
  "UP032",  # prefer f-strings
  "B007",   # unused loop variable
  "UP015",  # unnecessary mode arg to open()
  "UP035",  # typing.List/Dict/Type deprecated
  "F401",   # unused imports
  "UP006",  # prefer list/dict over typing.List/Dict
  "SIM113", # use enumerate()
  "F403",   # star import used
  "F405",   # names from star import may be undefined
  "UP030",  # implicit format positional fields
  "F841",   # assigned but unused
  "F601",   # duplicate dict keys
  "E712",   # comparison to True/False
  "SIM108", # prefer ternary
  "E713",   # use `not in`
  "F811",   # redefinition
  "SIM105", # use join()
  "B904",
]

[tool.mypy]
mypy_path = "."
exclude = ["^docs/", "^benchmarks/", "^experiments/"]
namespace_packages = true
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
strict_equality = true
